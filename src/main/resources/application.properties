spring.application.name=connectify-solutions
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

server.port=8080

# Base de datos local MySQL/MariaDB
spring.datasource.url=jdbc:mysql://localhost:3308/connectify_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# IZIPay SmartForm: valores sensibles solo por variables de entorno o application-local.properties.
# Nunca guardar usuario, contraseña REST, HMAC o claves privadas en Git.
izipay.enabled=${IZIPAY_ENABLED:false}
izipay.mode=${IZIPAY_MODE:TEST}
izipay.endpoint=${IZIPAY_ENDPOINT:https://api.micuentaweb.pe/api-payment/V4/Charge/CreatePayment}
izipay.username=${IZIPAY_USERNAME:}
izipay.password=${IZIPAY_PASSWORD:}
izipay.public-key=${IZIPAY_PUBLIC_KEY:}
izipay.hmac-sha256-key=${IZIPAY_HMAC_SHA256_KEY:}
izipay.smart-form-script-url=${IZIPAY_SMARTFORM_SCRIPT_URL:https://static.micuentaweb.pe/static/js/krypton-client/V4.0/stable/kr-payment-form.min.js}
izipay.success-url=${IZIPAY_SUCCESS_URL:http://localhost:8080/payments/izipay/success}
izipay.error-url=${IZIPAY_ERROR_URL:http://localhost:8080/payments/izipay/error}
izipay.cancel-url=${IZIPAY_CANCEL_URL:http://localhost:8080/payments/izipay/cancel}
izipay.notification-url=${IZIPAY_NOTIFICATION_URL:}
izipay.currency=${IZIPAY_CURRENCY:PEN}

# IZIPay Web Core Pop-In: independent from legacy Mi Cuenta Web credentials above.
izipay.web.enabled=${IZIPAY_WEB_ENABLED:true}
izipay.web.environment=${IZIPAY_WEB_ENVIRONMENT:sandbox}
izipay.web.merchant-code=${IZIPAY_WEB_MERCHANT_CODE:}
izipay.web.api-key=${IZIPAY_WEB_API_KEY:}
izipay.web.public-key=${IZIPAY_WEB_PUBLIC_KEY:}
izipay.web.hash-key=${IZIPAY_WEB_HASH_KEY:}
izipay.web.payment-methods=${IZIPAY_WEB_PAYMENT_METHODS:CARD,YAPE_CODE,PAGO_PUSH,QR}
izipay.web.ipn-url=${IZIPAY_WEB_IPN_URL:}
