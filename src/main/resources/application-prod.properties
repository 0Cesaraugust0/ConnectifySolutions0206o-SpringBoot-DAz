# Produccion: activar con SPRING_PROFILES_ACTIVE=prod.
server.port=${PORT:8080}

# Supabase PostgreSQL. Guardar estos valores como secretos del alojamiento.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.maximum-pool-size=5

# El esquema se crea mediante una migracion controlada antes del despliegue.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=connectify
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.thymeleaf.cache=true

# Cookies seguras para HTTPS.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never

# Retornos del dominio final. IZIPay permanece desactivado hasta probarlo.
izipay.success-url=https://www.showyouplay.com/payments/izipay/success
izipay.error-url=https://www.showyouplay.com/payments/izipay/error
izipay.cancel-url=https://www.showyouplay.com/payments/izipay/cancel
