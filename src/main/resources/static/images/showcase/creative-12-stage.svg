<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Conferencia Impulsa Negocios · plano referencial</title>
  <desc id="description">Vista conceptual de conferencia y comunidad empresarial, con escenario de ponencias y conexiones. Sin sectores ni asientos reales.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#183b47"/><stop offset="1" stop-color="#10222f"/></linearGradient>
    <linearGradient id="stage" x2="1" y2="0"><stop stop-color="#d4ac62"/><stop offset="1" stop-color="#f4d58d"/></linearGradient>
  </defs>
  <rect width="1200" height="760" fill="#f1f4f3"/>
  <rect x="32" y="30" width="1136" height="700" rx="30" fill="#fff" stroke="#dfe6e3" stroke-width="2"/>
  <text x="66" y="85" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#193442">CONFERENCIA IMPULSA NEGOCIOS</text>
  <text x="67" y="116" font-family="Arial,sans-serif" font-size="17" fill="#687c81">Ideas, ponencias y conexiones en una composición ejecutiva</text>
  <rect x="937" y="57" width="194" height="38" rx="19" fill="#eef0dd"/>
  <text x="1034" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#777039">PLANO REFERENCIAL</text>
  <rect x="65" y="146" width="790" height="522" rx="28" fill="url(#surface)"/>
  <path d="M122 206H799M122 610H799" stroke="#aec8c6" stroke-opacity=".18" stroke-width="2"/>
  <rect x="168" y="206" width="584" height="116" rx="18" fill="#224a56" stroke="#78a5a0" stroke-width="2"/>
  <path d="M190 285H730" stroke="url(#stage)" stroke-width="8" stroke-linecap="round"/>
  <text x="460" y="259" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#fff">ESCENARIO · PONENCIAS</text>
  <g fill="#315b64" stroke="#6d9997" stroke-width="2">
    <rect x="201" y="355" width="154" height="75" rx="14"/><rect x="383" y="355" width="154" height="75" rx="14"/><rect x="565" y="355" width="154" height="75" rx="14"/>
    <rect x="201" y="453" width="154" height="75" rx="14"/><rect x="383" y="453" width="154" height="75" rx="14"/><rect x="565" y="453" width="154" height="75" rx="14"/>
  </g>
  <text x="460" y="403" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#e5f2ed">PÚBLICO</text>
  <path d="M185 578H735" stroke="#cfa85e" stroke-width="2" stroke-dasharray="8 11"/>
  <circle cx="291" cy="578" r="7" fill="#e0bb73"/><circle cx="460" cy="578" r="7" fill="#e0bb73"/><circle cx="629" cy="578" r="7" fill="#e0bb73"/>
  <text x="460" y="632" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#d6e7df">Diagrama ilustrativo de audiencia y contenidos</text>
  <rect x="879" y="146" width="255" height="522" rx="26" fill="#fafbf8" stroke="#e5e9df"/>
  <text x="904" y="192" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#27444a">Para inspirar el diseño</text>
  <text x="904" y="231" font-family="Arial,sans-serif" font-size="16" fill="#718184">Esta vista transmite el</text>
  <text x="904" y="254" font-family="Arial,sans-serif" font-size="16" fill="#718184">ritmo del encuentro.</text>
  <rect x="904" y="302" width="205" height="70" rx="14" fill="#e6f0ec"/>
  <text x="921" y="344" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#32665c">Ponencias</text>
  <rect x="904" y="386" width="205" height="70" rx="14" fill="#f5eedb"/>
  <text x="921" y="428" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#8b6c37">Conexiones</text>
  <rect x="904" y="482" width="205" height="128" rx="16" fill="#f0f4f0"/>
  <text x="920" y="519" font-family="Arial,sans-serif" font-size="14" fill="#617372">La organización definirá</text>
  <text x="920" y="543" font-family="Arial,sans-serif" font-size="14" fill="#617372">la disposición del recinto,</text>
  <text x="920" y="567" font-family="Arial,sans-serif" font-size="14" fill="#617372">los accesos y los lugares.</text>
  <text x="66" y="703" font-family="Arial,sans-serif" font-size="15" fill="#778482">Plano referencial · no confirma sectores, ubicaciones ni numeración de asientos.</text>
</svg>
