<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Encuentro Musical · plano referencial</title>
  <desc id="description">Composición ilustrativa de escenario, ambiente visual y público. No representa sectores, asientos ni distribución confirmada.</desc>
  <defs>
    <linearGradient id="back" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#30205e"/></linearGradient>
    <linearGradient id="stage" x2="1" y2="1"><stop stop-color="#fd8c75"/><stop offset="1" stop-color="#da4c8a"/></linearGradient>
    <linearGradient id="floor" x2="1" y2="1"><stop stop-color="#544a98"/><stop offset="1" stop-color="#243b72"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1200" height="760" fill="#f3f2f7"/>
  <rect x="32" y="30" width="1136" height="700" rx="30" fill="#fff" stroke="#e1deeb" stroke-width="2"/>
  <text x="66" y="85" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1b1b2e">ENCUENTRO MUSICAL</text>
  <text x="67" y="116" font-family="Arial,sans-serif" font-size="17" fill="#625f77">Una escena dibujada a partir de sonido, luz y cercanía</text>
  <rect x="937" y="57" width="194" height="38" rx="19" fill="#f0e8f5"/>
  <text x="1034" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#654185">PLANO REFERENCIAL</text>
  <rect x="65" y="146" width="790" height="522" rx="28" fill="url(#back)"/>
  <circle cx="461" cy="256" r="126" fill="#e55a92" opacity=".15" filter="url(#glow)"/>
  <circle cx="460" cy="257" r="155" fill="none" stroke="#9b8ae6" stroke-opacity=".25" stroke-width="2"/>
  <circle cx="460" cy="257" r="196" fill="none" stroke="#9b8ae6" stroke-opacity=".15" stroke-width="2"/>
  <path d="M233 202Q460 126 688 202L668 287Q461 234 252 287Z" fill="url(#stage)"/>
  <path d="M260 222Q460 160 660 222" fill="none" stroke="#ffe1c9" stroke-width="3" opacity=".7"/>
  <text x="460" y="234" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#fff">ESCENARIO</text>
  <text x="460" y="261" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#fff3f1">foco musical</text>
  <path d="M197 322Q460 246 723 322L778 584Q460 654 142 584Z" fill="url(#floor)" stroke="#9c8bdd" stroke-opacity=".65" stroke-width="2"/>
  <path d="M244 358Q460 302 676 358M205 432Q460 363 716 432M166 511Q460 443 756 511" fill="none" stroke="#cdc1fc" stroke-opacity=".28" stroke-width="5"/>
  <text x="460" y="468" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#fff">ÁREA DEL PÚBLICO</text>
  <text x="460" y="497" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#e1dbfc">diagrama visual, sin asientos asignados</text>
  <path d="M152 211L205 257L175 329M768 211L715 257L745 329" fill="none" stroke="#ffb09a" stroke-width="7" stroke-linecap="round"/>
  <circle cx="140" cy="199" r="16" fill="#ff9f82"/><circle cx="780" cy="199" r="16" fill="#ff9f82"/>
  <text x="166" y="638" font-family="Arial,sans-serif" font-size="15" fill="#dbd5fa">Luz y visuales</text>
  <path d="M107 632H149" stroke="#ff9f82" stroke-width="6" stroke-linecap="round"/>
  <rect x="879" y="146" width="255" height="522" rx="26" fill="#faf8fc" stroke="#e8e3ed"/>
  <text x="904" y="192" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#27243c">Idea de montaje</text>
  <text x="904" y="231" font-family="Arial,sans-serif" font-size="16" fill="#625f77">Una vista de referencia</text>
  <text x="904" y="254" font-family="Arial,sans-serif" font-size="16" fill="#625f77">para imaginar la</text>
  <text x="904" y="277" font-family="Arial,sans-serif" font-size="16" fill="#625f77">experiencia del evento.</text>
  <rect x="904" y="319" width="205" height="66" rx="14" fill="#fce4e5"/>
  <circle cx="933" cy="352" r="13" fill="#e96d7e"/><text x="959" y="358" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#572e4a">Escenario</text>
  <rect x="904" y="398" width="205" height="66" rx="14" fill="#e8e5fa"/>
  <circle cx="933" cy="431" r="13" fill="#6659ae"/><text x="959" y="437" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#34306e">Público</text>
  <rect x="904" y="477" width="205" height="66" rx="14" fill="#ece6f4"/>
  <circle cx="933" cy="510" r="13" fill="#a176c1"/><text x="959" y="516" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#554074">Visuales</text>
  <text x="904" y="598" font-family="Arial,sans-serif" font-size="14" fill="#6d6882">El organizador definirá</text>
  <text x="904" y="620" font-family="Arial,sans-serif" font-size="14" fill="#6d6882">la distribución final.</text>
  <text x="66" y="703" font-family="Arial,sans-serif" font-size="15" fill="#777286">Plano referencial · no confirma sectores, ubicaciones ni numeración de asientos.</text>
</svg>
